<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>货物查询系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .title {
            font-size: 28px;
            color: #222;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 40px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 18px 0;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            width: 100%;
            color: white;
            line-height: 1.5;
        }

        .btn-us {
            background: linear-gradient(90deg, #4d88ff, #66a3ff);
        }

        .btn-air {
            background: linear-gradient(90deg, #ff6b6b, #ff8e8e);
        }

        .btn-large {
            background: linear-gradient(90deg, #2ed573, #7bed9f);
        }

        .btn-airport {
            background: linear-gradient(90deg, #9b59b6, #bb8fce);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        button.btn {
            outline: none;
            -webkit-appearance: none;
        }

        .tip-info {
            font-size: 14px;
            color: #888;
            line-height: 1.6;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-content {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .modal-content-large {
            background: white;
            border-radius: 16px;
            width: 98%;
            height: 98%;
            max-width: none;
            max-height: none;
            text-align: center;
            overflow: hidden;
        }

        .modal-title {
            font-size: 20px;
            margin-bottom: 25px;
            color: #333;
        }

        .modal-title-large {
            font-size: 28px;
            font-weight: bold;
            line-height: 50px;
            background: #fff;
            margin-bottom: 0;
        }

        .modal-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 20px;
            outline: none;
        }

        .modal-input:focus {
            border-color: #9b59b6;
        }

        .modal-btn {
            width: 100%;
            padding: 14px 0;
            background: #9b59b6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .close-btn {
            margin-top: 15px;
            background: #eee;
            color: #666;
        }

        .iframe-mask {
            position: relative;
            width: 100%;
            height: calc(100% - 50px);
        }

        .iframe-mask::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            pointer-events: none;
        }

        #largeIframe {
            width: 100%;
            height: 100%;
            border: none;
            clip-path: inset(130px 0 0 0);
            margin-top: -130px;
        }

        .close-large-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            font-size: 20px;
            cursor: pointer;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">货物查询系统</div>
        <div class="subtitle">选择查询类型快速访问</div>
        
        <div class="btn-group">
            <a href="http://tracking.nextsls.com/trace?app=5fa243c93aff970e4024ae5a" target="_blank" class="btn btn-us">
                美线货物查询
            </a>
            <a href="http://tracking.nextsls.com/trace?app=64085b2273f0420708520ad3" target="_blank" class="btn btn-air">
                空派货物查询
            </a>
            <button onclick="openLargeModal()" class="btn btn-large">
                欧盟超大件货物查询
            </button>
            <button onclick="openAirportModal()" class="btn btn-airport">
                空运到机场货物查询
            </button>
        </div>
        <div class="tip-info">
            仅供美线货物，欧盟空派小包，以及欧盟超大件和空运到机场货物查询路径 —— 滨弘国际物流
        </div>
    </div>

    <div class="modal" id="airportModal">
        <div class="modal-content">
            <div class="modal-title">空运到机场货物查询</div>
            <input type="text" class="modal-input" id="trackNo" placeholder="请输入货物查询号码">
            <button class="modal-btn" onclick="searchAirport()">立即查询</button>
            <button class="modal-btn close-btn" onclick="closeAirportModal()">关闭</button>
        </div>
    </div>

    <div class="modal" id="largeModal">
        <div class="modal-content-large">
            <button class="close-large-btn" onclick="closeLargeModal()">×</button>
            <div class="modal-title modal-title-large">超大件货物查询</div>
            <div class="iframe-mask">
                <iframe id="largeIframe" src="http://47.115.23.24:5001/#/mtracking" sandbox="allow-same-origin allow-scripts"></iframe>
            </div>
        </div>
    </div>

    <script>
        function openAirportModal() {
            document.getElementById("airportModal").style.display = "flex";
        }
        function closeAirportModal() {
            document.getElementById("airportModal").style.display = "none";
        }
        function searchAirport() {
            var val = document.getElementById("trackNo").value.trim();
            if(!val){
                alert("请输入查询号码");
                return;
            }
            alert("你输入的查询号："+ val);
            closeAirportModal();
        }

        function openLargeModal() {
            document.getElementById("largeModal").style.display = "flex";
            document.getElementById("largeIframe").src = document.getElementById("largeIframe").src;
        }
        function closeLargeModal() {
            document.getElementById("largeModal").style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.id === 'airportModal' ? closeAirportModal() : closeLargeModal();
            }
        }

        // 拦截查看源码快捷键
        document.addEventListener('keydown', function(e) {
            if (document.getElementById("largeModal").style.display === 'flex') {
                if (
                    e.key === 'F12' ||
                    (e.ctrlKey && e.key === 'u') ||
                    (e.ctrlKey && e.shiftKey && e.key === 'i') ||
                    (e.ctrlKey && e.key === 's')
                ) {
                    e.preventDefault();
                    return false;
                }
            }
        });

        // 拦截 iframe 右键
        document.getElementById('largeIframe').addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
    </script>
</body>
</html>
